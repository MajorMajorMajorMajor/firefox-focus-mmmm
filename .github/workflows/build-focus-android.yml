name: Build Firefox Focus Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/android/focus-android/**"
      - ".github/workflows/build-focus-android.yml"

jobs:
  build-focus-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android emulator component
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "emulator"

      - name: Install bundletool
        run: |
          mkdir -p "$HOME/.mozbuild"
          curl -fsSL -o "$HOME/.mozbuild/bundletool.jar" \
            https://github.com/google/bundletool/releases/latest/download/bundletool-all.jar

      - name: Create CI mozconfig
        run: |
          cat > .mozconfig-ci <<'EOF'
          . "$topsrcdir/mobile/android/config/mozconfigs/android-arm-gradle-dependencies/nightly"
          ac_add_options --with-android-sdk=$ANDROID_SDK_ROOT
          EOF

      - name: Configure Mozilla build environment
        env:
          MOZ_AUTOMATION: "1"
          MOZCONFIG: .mozconfig-ci
        run: ./mach configure

      - name: Build Focus debug APK
        env:
          MOZ_AUTOMATION: "1"
          MOZCONFIG: .mozconfig-ci
        working-directory: mobile/android/focus-android
        run: ./gradlew --no-daemon app:assembleFocusDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focus-debug-apk
          path: |
            mobile/android/focus-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: Build Firefox Focus Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/**
    paths:
      - "mobile/android/focus-android/**"
      - ".github/workflows/build-focus-android.yml"

jobs:
  build-focus-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Mozilla build environment
        env:
          MOZ_AUTOMATION: "1"
          MOZCONFIG: mobile/android/config/mozconfigs/android-arm-gradle-dependencies/nightly
        run: ./mach configure

      - name: Build Focus debug APK
        env:
          MOZ_AUTOMATION: "1"
          MOZCONFIG: mobile/android/config/mozconfigs/android-arm-gradle-dependencies/nightly
        working-directory: mobile/android/focus-android
        run: ./gradlew --no-daemon app:assembleFocusDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focus-debug-apk
          path: |
            mobile/android/focus-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

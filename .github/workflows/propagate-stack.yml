name: Propagate stack to dist/main

on:
  workflow_dispatch:

jobs:
  propagate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Require workflow push token
        run: |
          if [ -z "${{ secrets.WORKFLOW_PUSH_TOKEN }}" ]; then
            echo "ERROR: WORKFLOW_PUSH_TOKEN is required (classic PAT with repo + workflow scopes)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Fetch all branches
        run: git fetch origin

      - name: Rebase src/automation onto src/patches/current
        run: |
          git checkout -B src/automation origin/src/automation

          set +e
          git rebase -X theirs origin/src/patches/current
          REBASE_EXIT=$?
          set -e

          while [ $REBASE_EXIT -ne 0 ] && { [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; }; do
            if git ls-files -u -- .github/workflows/pr-handler.yml | grep -q .; then
              git rm -f .github/workflows/pr-handler.yml || true
              git add -A .
              set +e
              GIT_EDITOR=true git rebase --continue
              REBASE_EXIT=$?
              set -e
            else
              echo "Unhandled rebase conflict while rebasing src/automation"
              git status --short
              exit 1
            fi
          done

          if [ $REBASE_EXIT -ne 0 ]; then
            echo "Rebase failed"
            exit $REBASE_EXIT
          fi

      - name: Remove non-fork GitHub workflows
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          find .github/workflows -maxdepth 1 -type f \
            ! -name 'build-and-release.yml' \
            ! -name 'propagate-stack.yml' \
            ! -name 'sync-upstream.yml' \
            -print -delete

          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "ci: remove upstream workflow files"
          fi

      - name: Reset dist/main to src/automation
        id: reset_dist
        run: |
          PREV_DIST=$(git rev-parse origin/dist/main)
          git checkout -B dist-main-local origin/dist/main
          git reset --hard src/automation
          NEW_DIST=$(git rev-parse dist-main-local)
          if [ "$PREV_DIST" = "$NEW_DIST" ]; then
            echo "dist_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "dist_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Force-push
        if: steps.reset_dist.outputs.dist_changed == 'true'
        run: |
          git push --force-with-lease origin src/automation:src/automation
          git push --force-with-lease origin dist-main-local:dist/main

      - name: Dispatch build-and-release
        if: steps.reset_dist.outputs.dist_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN }}
        run: gh -R MajorMajorMajorMajor/firefox-focus-mmmm workflow run build-and-release.yml --ref dist/main

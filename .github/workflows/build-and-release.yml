name: Build and release Firefox Focus

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/android/**"
      - ".github/workflows/build-and-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Link JDK into Mozilla expected path
        run: |
          JAVA_RUNTIME_VERSION=$(java -XshowSettings:properties -version 2>&1 | sed -n 's/.*java.runtime.version = //p' | head -n1)
          JAVA_RUNTIME_VERSION=${JAVA_RUNTIME_VERSION%%-*}
          mkdir -p "$HOME/.mozbuild/jdk"
          ln -sfn "$JAVA_HOME" "$HOME/.mozbuild/jdk/jdk-$JAVA_RUNTIME_VERSION"

      - name: Install Android emulator component
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "emulator"

      - name: Install bundletool
        run: |
          mkdir -p "$HOME/.mozbuild"
          BUNDLETOOL_URL=$(python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("https://api.github.com/repos/google/bundletool/releases/latest") as r:
              release = json.load(r)
          for asset in release.get("assets", []):
              name = asset.get("name", "")
              if name.startswith("bundletool-all-") and name.endswith(".jar"):
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("No bundletool-all jar found")
          PY
          )
          curl -fsSL -o "$HOME/.mozbuild/bundletool.jar" "$BUNDLETOOL_URL"

      - name: Resolve geckoview-nightly version
        run: |
          LATEST=$(curl -fsSL "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-nightly-omni/maven-metadata.xml" \
            | python3 -c "import sys,re; m=re.search(r'<latest>(.*?)</latest>', sys.stdin.read()); print(m.group(1))")
          GECKO_BUILD_DATE=$(echo "$LATEST" | cut -d. -f3)
          echo "Resolved geckoview: $LATEST (MOZ_BUILD_DATE=$GECKO_BUILD_DATE)"
          echo "MOZ_BUILD_DATE=$GECKO_BUILD_DATE" >> "$GITHUB_ENV"

      - name: Write mozconfig
        run: |
          cat > .mozconfig <<'EOF'
          . "$topsrcdir/build/mozconfig.common"
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=arm-linux-androideabi
          ac_add_options --with-branding=mobile/android/branding/nightly
          ac_add_options --enable-update-channel=nightly
          ac_add_options --disable-compile-environment
          ac_add_options --disable-tests
          ac_add_options --with-gradle
          ac_add_options --without-mozilla-api-keyfile
          ac_add_options --without-google-safebrowsing-api-keyfile
          ac_add_options --without-embedded-uniffi-bindgen
          ac_add_options --without-nimbus-fml
          ac_add_options --with-android-sdk=$ANDROID_SDK_ROOT
          export MOZILLA_OFFICIAL=1
          export MOZ_ANDROID_FAT_AAR_ARCHITECTURES=armeabi-v7a
          EOF

      - name: mach configure
        env:
          MOZ_AUTOMATION: "1"
        run: ./mach configure

      - name: Stub generated CrashReport.java
        run: |
          TOPOBJDIR=$(find . -maxdepth 1 -name 'obj-*' -type d | head -1)
          STUB_DIR="$TOPOBJDIR/mobile/android/android-components/components/lib/crash/src/main/java/mozilla/components/lib/crash/service"
          mkdir -p "$STUB_DIR"
          cat > "$STUB_DIR/CrashReport.java" <<'JEOF'
          package mozilla.components.lib.crash.service;

          public final class CrashReport {
              public enum Annotation {
                  AndroidComponentVersion,
                  Android_Board,
                  Android_Brand,
                  Android_CPU_ABI,
                  Android_CPU_ABI2,
                  Android_Device,
                  Android_Display,
                  Android_Fingerprint,
                  Android_Hardware,
                  Android_Manufacturer,
                  Android_Model,
                  Android_PackageName,
                  Android_ProcessName,
                  Android_Version,
                  ApplicationBuildID,
                  ApplicationServicesVersion,
                  Breadcrumbs,
                  BuildID,
                  CrashID,
                  CrashTime,
                  CrashType,
                  DistributionID,
                  GeckoViewVersion,
                  GleanVersion,
                  InstallTime,
                  JavaException,
                  JavaStackTrace,
                  MinidumpSha256Hash,
                  ProcessType,
                  ProductID,
                  ProductName,
                  ReleaseChannel,
                  RemoteType,
                  StartupTime,
                  Vendor,
                  Version,
                  additional_minidumps,
                  useragent_locale
              }

              private CrashReport() {}
          }
          JEOF

      - name: Build Focus debug APK
        env:
          MOZ_AUTOMATION: "1"
        run: |
          cd mobile/android/focus-android
          ../../../gradlew --no-daemon app:assembleFocusDebug

      - name: Locate APK
        if: always()
        run: |
          echo "=== All APKs ==="
          find . -name '*.apk' 2>/dev/null | grep -v '.git' || echo "none found"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: focus-debug-apk
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          APK=$(find . -name '*.apk' -path '*/apk/*' | grep -v '.git' | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK found to publish"
            exit 1
          fi
          gh release create "$TAG" \
            --title "Focus $TAG" \
            --notes "Automated build from ${GITHUB_SHA}" \
            "$APK"
